syntax = "proto3";

package com.zwash.common.grpc;

option java_multiple_files = true;
option java_package = "com.zwash.common.grpc";
option java_outer_classname = "CarServiceProto";

import "user.proto";

service CarService {
  rpc GetCar(CarRequest) returns (CarResponse);
}

message CarRequest {
  int64 id = 1;
}

message CarResponse {
  int64 id = 1;
  string brand = 2;
  string model = 3;
  string licensePlate = 4;

  UserResponse user = 5;
}
