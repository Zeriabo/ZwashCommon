syntax = "proto3";

package com.zwash.common.grpc;

option java_multiple_files = true;
option java_package = "com.zwash.common.grpc";
option java_outer_classname = "StationProto";

import "service_provider.proto"; 

message StationRequest {
  int64 id = 1;
}

message StationResponse {
  int64 id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  string address = 5;

 
  ServiceProviderResponse serviceProvider = 6;
}

service StationService {
  rpc GetStation(StationRequest) returns (StationResponse);
}
